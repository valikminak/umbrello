<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Разметка фраз</title>
<style>
:root{--bg:#f6f6f4;--fg:#1c1c1c;--mut:#6b6b6b;--card:#fff;--line:#d8d8d4;--acc:#1f5eff;--bad:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#151515;--fg:#eee;--mut:#9a9a9a;--card:#1f1f1f;--line:#363636;--acc:#6b95ff;--bad:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px;display:grid;gap:14px}
video{width:100%;max-height:50vh;background:#000;border-radius:6px}
.clock{font:600 44px/1 ui-monospace,Menlo,monospace;letter-spacing:.02em}
.sub{color:var(--mut);font:13px ui-monospace,Menlo,monospace}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:6px 10px}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input[type=number]{width:110px;font-family:ui-monospace,Menlo,monospace}
input.t{flex:1;min-width:200px}
textarea{width:100%;height:200px;font:13px ui-monospace,Menlo,monospace}
ol{margin:0;padding:0;list-style:none;display:grid;gap:4px}
li{display:flex;gap:8px;align-items:center;padding:6px 8px;background:var(--card);border:1px solid var(--line);border-radius:5px}
li .tm{font:12px ui-monospace,Menlo,monospace;color:var(--mut);white-space:nowrap}
li .tx{flex:1}
#msg{color:var(--bad);min-height:1.4em}
#lyr{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:6px}
#lyr summary{cursor:pointer;font-weight:600}
#lyin{height:110px;margin:8px 0}
.lines{position:relative;max-height:240px;overflow:auto}
.lines li{padding:0;border:0;background:none}
.ln{width:100%;text-align:left}
.ln.cur{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc);font-weight:600}
.ln.done{color:var(--mut);text-decoration:line-through}
.keys{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<main>
  <div class="row">
    <input type="file" id="file" accept="video/*,audio/*" aria-label="Локальный файл">
    <input class="t" id="url" placeholder="или ссылка на видео (https://...)" aria-label="Ссылка">
    <button id="load">Открыть</button>
  </div>

  <video id="v" controls preload="auto" playsinline></video>

  <div>
    <div class="clock" id="clock">0:00.000</div>
    <div class="sub" id="sub">0.000 с</div>
  </div>

  <div class="row">
    <button id="pp" class="p">Играть / пауза</button>
    <button data-d="-1">−1 с</button>
    <button data-d="-0.1">−100 мс</button>
    <button data-d="-0.04">−кадр</button>
    <button data-d="0.04">+кадр</button>
    <button data-d="0.1">+100 мс</button>
    <button data-d="1">+1 с</button>
    <select id="rate" aria-label="Скорость">
      <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
      <option value="1" selected>1×</option><option value="1.5">1.5×</option>
    </select>
  </div>
  <div class="keys">Горячие клавиши: пробел, ←/→ ±100 мс, Shift+←/→ ±1 с, Alt+←/→ ±кадр, S — начало, E — конец, Enter — добавить фразу, ↑/↓ — строка текста песни. Работают, когда курсор не в поле ввода (Esc — выйти из поля).</div>

  <div class="row">
    <button id="ms">Начало (S)</button>
    <input type="number" id="st" step="0.001" min="0" placeholder="start" aria-label="start">
    <button id="me">Конец (E)</button>
    <input type="number" id="en" step="0.001" min="0" placeholder="end" aria-label="end">
    <button id="pre">Прослушать</button>
  </div>
  <div class="row">
    <input class="t" id="tx" placeholder="Текст фразы, Enter — добавить" aria-label="Текст фразы">
    <button id="add" class="p">Добавить фразу</button>
  </div>
  <div id="msg" role="status"></div>

  <section id="lyr">
    <details id="lyd" open>
      <summary>Текст песни</summary>
      <textarea id="lyin" placeholder="Вставь сюда текст песни, одна строка на фразу" aria-label="Текст песни"></textarea>
      <div class="row">
        <button id="lyload" class="p">Разобрать на строки</button>
        <label><input type="checkbox" id="lystrip" checked> убрать (слова в скобках)</label>
      </div>
    </details>
    <div class="row">
      <button id="lyprev">↑ Предыдущая</button>
      <button id="lynext">↓ Следующая</button>
    </div>
    <ol id="lylist" class="lines"></ol>
  </section>

  <ol id="list"></ol>

  <div class="row">
    <input class="t" id="title" placeholder="title урока" aria-label="title">
    <input class="t" id="vid" placeholder="video: путь или ссылка" aria-label="video">
    <button id="copy" class="p">Скопировать JSON</button>
    <button id="reset">Очистить всё</button>
  </div>
  <textarea id="out" readonly aria-label="JSON"></textarea>
</main>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const v = $("v");
  let phrases = [], stopAt = null, lines = [], cur = -1;

  const r3 = n => Math.round(n * 1000) / 1000;
  const fmt = t => { const m = Math.floor(t / 60); return m + ":" + (t - m * 60).toFixed(3).padStart(6, "0"); };
  const msg = t => { $("msg").textContent = t || ""; };

  function tick() {
    const t = v.currentTime || 0;
    $("clock").textContent = fmt(t);
    $("sub").textContent = r3(t).toFixed(3) + " с" + (v.duration ? " из " + r3(v.duration).toFixed(3) : "");
    if (stopAt !== null && t >= stopAt) { v.pause(); v.currentTime = stopAt; stopAt = null; }
    requestAnimationFrame(tick);
  }
  tick();

  function setSrc(src, name) {
    v.src = src;
    if (!$("vid").value) $("vid").value = name;
    if (!$("title").value) $("title").value = name.replace(/\.[^.]+$/, "").split("/").pop();
  }
  $("file").onchange = e => {
    const f = e.target.files[0];
    if (f) setSrc(URL.createObjectURL(f), "videos/" + f.name);
  };
  $("load").onclick = () => { const u = $("url").value.trim(); if (u) setSrc(u, u); };

  function toggle() { stopAt = null; v.paused ? v.play() : v.pause(); }
  function nudge(d) { stopAt = null; v.currentTime = Math.max(0, Math.min(v.duration || 1e9, v.currentTime + d)); }
  const markStart = () => { $("st").value = r3(v.currentTime); };
  const markEnd = () => { $("en").value = r3(v.currentTime); };

  $("pp").onclick = toggle;
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => nudge(parseFloat(b.dataset.d)));
  $("rate").onchange = e => { v.playbackRate = parseFloat(e.target.value); e.target.blur(); };
  $("ms").onclick = markStart;
  $("me").onclick = markEnd;
  $("pre").onclick = () => {
    const s = parseFloat($("st").value), e = parseFloat($("en").value);
    if (!(e > s)) return msg("Укажи start и end, end должен быть больше start.");
    msg(); v.currentTime = s; stopAt = e; v.play();
  };

  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === "r") { e.preventDefault(); return; }
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { if (e.key === "Escape") e.target.blur(); return; }
    if (e.metaKey || e.ctrlKey) return;
    const k = e.key.toLowerCase();
    if (e.key === " ") { e.preventDefault(); toggle(); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      const dir = e.key === "ArrowLeft" ? -1 : 1;
      nudge(dir * (e.altKey ? 0.04 : e.shiftKey ? 1 : 0.1));
    }
    else if (k === "s") markStart();
    else if (k === "e") markEnd();
    else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && lines.length) { e.preventDefault(); pick(cur + (e.key === "ArrowDown" ? 1 : -1)); }
    else if (e.key === "Enter" && e.target.tagName !== "BUTTON") { e.preventDefault(); add(); }
  });

  function add() {
    const s = parseFloat($("st").value), e = parseFloat($("en").value), text = $("tx").value.trim();
    if (!Number.isFinite(s) || !Number.isFinite(e) || e <= s) return msg("Нужны start и end, end больше start.");
    if (!text) return msg("Впиши текст фразы.");
    const clash = phrases.find(p => s < p.end && e > p.start);
    if (clash) return msg("Пересекается с фразой «" + clash.text + "». Сегменты не должны пересекаться.");
    phrases.push({ start: s, end: e, text, _l: lines.length ? cur : undefined });
    phrases.sort((a, b) => a.start - b.start);
    $("st").value = e; $("en").value = "";
    msg(); render();
    if (lines.length && cur + 1 < lines.length) { pick(cur + 1); $("tx").blur(); }
    else { $("tx").value = ""; $("tx").focus(); }
  }
  $("add").onclick = add;
  $("tx").addEventListener("keydown", e => { if (e.key === "Enter") add(); });

  function render() {
    const ol = $("list"); ol.innerHTML = "";
    phrases.forEach((p, i) => {
      const li = document.createElement("li");
      const tm = document.createElement("span"); tm.className = "tm"; tm.textContent = p.start.toFixed(3) + " – " + p.end.toFixed(3);
      const tx = document.createElement("span"); tx.className = "tx"; tx.textContent = p.text;
      const play = document.createElement("button"); play.textContent = "▶";
      play.setAttribute("aria-label", "Проиграть фразу"); play.onclick = () => { v.currentTime = p.start; stopAt = p.end; v.play(); };
      const edit = document.createElement("button"); edit.textContent = "Править";
      edit.onclick = () => { $("st").value = p.start; $("en").value = p.end; $("tx").value = p.text; if (p._l !== undefined) cur = p._l; phrases.splice(i, 1); render(); $("tx").focus(); };
      const del = document.createElement("button"); del.textContent = "Удалить";
      del.onclick = () => { phrases.splice(i, 1); render(); };
      li.append(tm, tx, play, edit, del); ol.append(li);
    });
    updateOut();
    renderLines();
  }

  function updateOut() {
    const segments = phrases.map(({ start, end, text }) => ({ start, end, text }));
    $("out").value = JSON.stringify({ title: $("title").value, video: $("vid").value, segments }, null, 2);
    save();
  }

  function splitLyrics() {
    const strip = $("lystrip").checked;
    return $("lyin").value.split(/\r?\n/)
      .map(s => (strip ? s.replace(/\s*\([^)]*\)/g, "") : s).trim())
      .filter(Boolean);
  }

  function parseLyrics() {
    lines = splitLyrics();
    if (!lines.length) return msg("Вставь текст песни в поле выше.");
    msg(); $("lyd").open = false; pick(0);
  }

  function pick(i) {
    if (!lines.length) return msg("Сначала вставь текст песни и нажми «Разобрать на строки».");
    cur = Math.max(0, Math.min(lines.length - 1, i));
    $("tx").value = lines[cur];
    renderLines();
    save();
  }

  function renderLines() {
    const ol = $("lylist"); ol.innerHTML = "";
    const done = new Set(phrases.map(p => p._l));
    let curBtn = null;
    lines.forEach((t, i) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.className = "ln" + (i === cur ? " cur" : "") + (done.has(i) ? " done" : "");
      b.textContent = t;
      b.onclick = () => pick(i);
      li.append(b); ol.append(li);
      if (i === cur) curBtn = b;
    });
    if (curBtn) ol.scrollTop = curBtn.offsetTop - ol.clientHeight / 2;
  }

  $("lyload").onclick = parseLyrics;
  $("lyprev").onclick = () => pick(cur - 1);
  $("lynext").onclick = () => pick(cur + 1);
  $("title").oninput = updateOut;
  $("vid").oninput = updateOut;

  $("copy").onclick = async () => {
    updateOut();
    try { await navigator.clipboard.writeText($("out").value); msg(); $("copy").textContent = "Скопировано"; }
    catch (_) { $("out").select(); $("copy").textContent = "Выделено, нажми Cmd+C"; }
    setTimeout(() => { $("copy").textContent = "Скопировать JSON"; }, 1500);
  };
  function save() {
    try {
      localStorage.setItem("marker-state-v1", JSON.stringify({
        phrases, cur, lyrics: $("lyin").value, strip: $("lystrip").checked,
        title: $("title").value, vid: $("vid").value, url: $("url").value,
        st: $("st").value, en: $("en").value, tx: $("tx").value
      }));
    } catch (_) {}
  }

  $("lyin").addEventListener("paste", () => setTimeout(parseLyrics, 0));
  $("lystrip").onchange = () => { if ($("lyin").value.trim()) parseLyrics(); };
  ["st", "en", "tx", "url", "lyin"].forEach(id => $(id).addEventListener("input", save));

  $("reset").onclick = () => {
    if (!confirm("Стереть все фразы и текст песни?")) return;
    phrases = []; lines = []; cur = -1;
    ["lyin", "st", "en", "tx", "title", "vid"].forEach(id => { $(id).value = ""; });
    $("lyd").open = true; msg(); render();
  };

  window.addEventListener("beforeunload", e => {
    if (phrases.length) { e.preventDefault(); e.returnValue = ""; }
  });

  try {
    const s = JSON.parse(localStorage.getItem("marker-state-v1") || "null");
    if (s) {
      phrases = Array.isArray(s.phrases) ? s.phrases : [];
      $("lyin").value = s.lyrics || ""; $("lystrip").checked = s.strip !== false;
      $("title").value = s.title || ""; $("vid").value = s.vid || ""; $("url").value = s.url || "";
      $("st").value = s.st || ""; $("en").value = s.en || ""; $("tx").value = s.tx || "";
      lines = splitLyrics();
      cur = lines.length ? Math.max(0, Math.min(lines.length - 1, s.cur | 0)) : -1;
      if (lines.length) $("lyd").open = false;
      if (s.url) v.src = s.url;
      else if (phrases.length || lines.length) msg("Данные восстановлены. Выбери видео-файл заново.");
    }
  } catch (_) {}

  render();
})();
</script>
</body>
</html>
