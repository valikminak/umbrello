<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Test</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #F4F6FA);
    --card: var(--tg-theme-section-bg-color, #FFFFFF);
    --text: var(--tg-theme-text-color, #1C2233);
    --hint: var(--tg-theme-hint-color, #7A8196);
    --accent: var(--tg-theme-button-color, #3478F6);
    --accent-text: var(--tg-theme-button-text-color, #FFFFFF);
    --line: rgba(128,128,128,.22);
    --ok: #1FA25C; --ok-soft: rgba(31,162,92,.14);
    --bad: #E0453A; --bad-soft: rgba(224,69,58,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: var(--tg-theme-bg-color, #17191F);
      --card: var(--tg-theme-section-bg-color, #22252D);
      --text: var(--tg-theme-text-color, #ECEEF3);
      --hint: var(--tg-theme-hint-color, #8D93A5);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
       -webkit-tap-highlight-color:transparent}
  .app{max-width:600px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom));
       min-height:100vh;display:flex;flex-direction:column}

  .top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .counter{font-size:14px;font-weight:600;color:var(--hint);white-space:nowrap}
  .bar{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .3s ease}

  .question{background:var(--card);border-radius:18px;padding:22px 20px;margin-bottom:14px;
            font-size:22px;line-height:1.35;font-weight:600;
            overflow-wrap:anywhere;hyphens:auto;white-space:pre-wrap}
  .question.long{font-size:18px}

  .options{display:flex;flex-direction:column;gap:10px}
  .opt{width:100%;text-align:left;font:inherit;color:var(--text);background:var(--card);
       border:2px solid transparent;border-radius:14px;padding:14px 16px;min-height:54px;
       cursor:pointer;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.35;
       transition:background .15s,border-color .15s,transform .08s}
  .opt:active{transform:scale(.985)}
  .opt:focus-visible{outline:none;border-color:var(--accent)}
  .opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);cursor:default;
             animation:shake .3s}
  .opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .opt:disabled{cursor:default}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  .msg{min-height:24px;margin-top:12px;text-align:center;font-size:15px;font-weight:600;color:var(--bad)}

  .center{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
  .big{font-size:56px;font-weight:700;line-height:1;margin:8px 0}
  .sub{color:var(--hint);margin:0 0 20px}
  .mistakes{background:var(--card);border-radius:16px;padding:6px 16px;text-align:left;margin-bottom:20px}
  .mistakes div{padding:10px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
  .mistakes div:last-child{border-bottom:0}
  .mistakes b{color:var(--ok);font-weight:600}
  .mistakes span{color:var(--hint);font-size:14px}
  .btn{display:block;width:100%;font:600 17px/1 inherit;font-family:inherit;border:0;border-radius:14px;
       padding:16px;cursor:pointer;background:var(--accent);color:var(--accent-text);margin-bottom:10px}
  .btn.ghost{background:var(--card);color:var(--accent)}
  h2{margin:0 0 4px;font-size:24px}
  .status{min-height:22px;margin:0 0 14px;font-size:15px;font-weight:600;color:var(--hint)}
  .status.ok{color:var(--ok)}
  .status.bad{color:var(--bad)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"><div class="center"><p class="sub">Loading…</p></div></div>

<script>
const WORKER_URL = "https://umbrello.valikminak.workers.dev/";
const TEST_FILE = "test.json"; // tasks

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const app = document.getElementById("app");
let questions = [], index = 0, mistakes = 0, log = [], tries = 0;

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const vibrate = t => { try { tg && tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };

async function load() {
  try {
    const res = await fetch(TEST_FILE + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("Файл не знайдено (" + res.status + ")");
    const data = await res.json();
    questions = data.filter(x => x && x.q && x.right && Array.isArray(x.wrong));
    if (!questions.length) throw new Error("У файлі немає завдань");
    start();
  } catch (e) {
    app.innerHTML = `<div class="center"><h2>Не вдалося завантажити тест</h2>
      <p class="sub">${esc(e.message)}</p><button class="btn" onclick="load()">Спробувати ще раз</button></div>`;
  }
}

function start() { index = 0; mistakes = 0; log = []; show(); }

function show() {
  const item = questions[index];
  tries = 0;
  const opts = shuffle([item.right, ...item.wrong]);
  const long = String(item.q).length > 90 ? " long" : "";
  app.innerHTML = `
    <div class="top">
      <span class="counter">${index + 1} / ${questions.length}</span>
      <div class="bar"><i style="width:${index / questions.length * 100}%"></i></div>
    </div>
    <div class="question${long}">${esc(item.q)}</div>
    <div class="options">${opts.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>
    <div class="msg" id="msg"></div>`;
  app.querySelectorAll(".opt").forEach(btn => {
    btn.onclick = () => choose(btn, opts[btn.dataset.i], item);
  });
}

function choose(btn, value, item) {
  if (btn.disabled) return;
  if (value === item.right) {
    btn.classList.add("right");
    app.querySelectorAll(".opt").forEach(b => b.disabled = true);
    vibrate("success");
    if (tries > 0) log.push({ q: item.q, right: item.right, tries });
    setTimeout(() => { index++; index < questions.length ? show() : finish(); }, 450);
  } else {
    tries++; mistakes++;
    btn.classList.add("wrong");
    btn.disabled = true;
    vibrate("error");
    document.getElementById("msg").textContent = "Wrong. Try again!";
  }
}

function finish() {
  const total = questions.length;
  const firstTry = total - log.length;
  app.innerHTML = `
    <div class="center">
      <h2>Well done!</h2>
      <div class="big">${firstTry} / ${total}</div>
      <p class="sub">first try · mistakes: ${mistakes}</p>
      ${log.length ? `<div class="mistakes">${log.map(m =>
        `<div>${esc(m.q)}<br><b>${esc(m.right)}</b> <span>· mistakes: ${m.tries}</span></div>`).join("")}</div>` : ""}
      <p class="status" id="status"></p>
      <button class="btn ghost" id="retry" style="display:none">Send again</button>
      <button class="btn" id="again">Try again</button>
      <button class="btn ghost" id="close">Finish</button>
    </div>`;
  document.getElementById("again").onclick = start;
  document.getElementById("close").onclick = () => { if (tg) tg.close(); else window.close(); };
  document.getElementById("retry").onclick = send;
  send();
}

async function send() {
  const status = document.getElementById("status");
  const retry = document.getElementById("retry");
  const total = questions.length;
  let text = `З першої спроби: ${total - log.length} з ${total}\n` +
    `Усього помилок: ${mistakes}`;
  if (log.length) {
    text += "\n\nПомилки:\n" + log.map(m => `• ${m.q} → ${m.right} (${m.tries})`).join("\n");
  }
  status.className = "status";
  status.textContent = "Sending result…";
  retry.style.display = "none";
  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: tg ? tg.initData : "", text })
    });
    if (!res.ok) throw new Error(res.status);
    status.className = "status ok";
    status.textContent = "Result sent to teacher ✓";
  } catch (e) {
    status.className = "status bad";
    status.textContent = "Couldn't send the result.";
    retry.style.display = "block";
  }
}

load();
</script>
</body>
</html>
